name: dispatch-probe

# موقت: رفتار GITHUB_TOKEN + dispatch API را دقیقاً داخل runner تست می‌کند.
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  actions: write
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          python3 - <<'EOF'
          import os, subprocess, urllib.request
          token = os.environ.get("GITHUB_TOKEN", "")
          print("token_len:", len(token))
          remote = subprocess.run(["git", "remote", "get-url", "origin"], capture_output=True, text=True).stdout.strip()
          print("remote:", remote)
          req = urllib.request.Request(
              "https://api.github.com/repos/mahdine/news_agg/actions/workflows/iv-deploy.yml/dispatches",
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
              data=b'{"ref": "main"}',
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print("dispatch status:", r.status)
          except Exception as e:
              print("dispatch ERROR:", type(e).__name__, e)
          EOF
