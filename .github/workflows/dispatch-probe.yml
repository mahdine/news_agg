name: dispatch-probe

# موقت: رفتار GITHUB_TOKEN + dispatch API را دقیقاً داخل runner تست می‌کند.
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  actions: write
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        env:
          EXPR_TOKEN: ${{ github.token }}
        run: |
          echo "shell GITHUB_TOKEN len: ${#GITHUB_TOKEN}"
          echo "expr token len: ${#EXPR_TOKEN}"
          echo "GITHUB_REPOSITORY: $GITHUB_REPOSITORY"
          echo "GITHUB_SHA: $GITHUB_SHA"
          env | cut -d= -f1 | grep -i "^GITHUB" | sort
          git config --local --get-regexp 'http\..*extraheader' >/dev/null && echo "extraheader: present" || echo "no extraheader"
