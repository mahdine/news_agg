name: iv-deploy

# worker زنده وقتی صفحه‌ی ترجمه‌ی کامل (iv/*.html) push می‌کند، سایت باید
# ظرف چند دقیقه deploy شود تا لینکی که در تلگرام فرستاده شده باز شود.
# ساختار سایت با publish.yml یکسان است: scorecard به‌عنوان index + صفحات iv/.
on:
  push:
    branches: [main]
    paths:
      - "iv/**"
  # خط پست‌گذاری صفحه را از داخل همان workflow push می‌کند و pushِ workflow
  # روی on:pushِ workflow‌های دیگر اثر ندارد (GitHub برای جلوگیری از حلقه) —
  # پس main.py بعد از push، همین workflow را workflow_dispatch می‌کند.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: stage site
        run: |
          mkdir site
          cp scorecard.html site/index.html
          mkdir -p site/iv
          cp iv/*.html site/iv/ 2>/dev/null || true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # deploy-pages index را بلافاصله بعد از final شدن artifact query می‌کند؛
      # گاهی artifact هنوز در index ثبت نشده و "No artifacts named github-pages
      # were found" می‌دهد. یک توقف کوتاه race را برطرف می‌کند.
      - name: wait for artifact index
        run: sleep 20

      - uses: actions/deploy-pages@v4
