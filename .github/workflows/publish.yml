name: publish

# تایمینگ اجرای ساعتی روی cron-job.org است، نه cron خودِ GitHub.
# GitHub برای schedule تضمین اجرای سر ساعت نمی‌دهد و روی runnerهای شلوغ
# تأخیر پنج تا بیست دقیقه (و گاهی بیشتر) رایج است. cron-job.org هر ساعت
# با API گیت‌هاب (workflow_dispatch) این workflow را بیدار می‌کند:
#   method:  POST
#   url:     https://api.github.com/repos/<owner>/PersianTwitter/dispatches
#   body:    {"event": "workflow_dispatch"}
#   cron:    "23 5-21 * * *"   (تایمزون job در cron-job.org: Asia/Tehran → ۵:۲۳ تا
#              ۲۱:۲۳ به‌وقت تهران = ۰۱:۵۳ تا ۱۷:۵۳ UTC؛ dispatchها در دقیقه‌ی :53 UTC می‌رسند)
#   token:   یک GITHUB_TOKEN با scope repo
# راهنمای کامل نصب در بخش Deploying بخش README است.
on:
  workflow_dispatch:

# برای commit کردن state.json لازم است.
# actions: write — main.py بعد از pushِ صفحه‌ی iv، iv-deploy.yml را
# workflow_dispatch می‌کند (push از داخل workflow روی on:push اثر ندارد).
permissions:
  contents: write
  pages: write
  actions: write
  id-token: write

# اجراهای همزمان روی یک state.json به هم می‌ریزند.
concurrency:
  group: state-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # checkout روی commitِ لحظه‌ی trigger است، نه main فعلی. اجرایی که
      # دقیقه‌ها در صف runner مانده باشد (یا پشت یک اجرای قبلی در صف
      # concurrency بماند) وگرنه state کهنه می‌خواند و ماجراهای پست‌شده‌ی
      # بعد از trigger را «جدید» می‌پندارد. همگام‌سازی با آخرین main قبل
      # از کار، دیرهنگام‌ترین اجرا را هم روی تازه‌ترین وضعیت می‌نشاند.
      - name: sync main
        run: git fetch origin main && git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: run bot
        env:
          # از 2026 گیت‌هاب env متغیر GITHUB_TOKEN را دیگر در stepها تزریق
          # نمی‌کند (probe 2026-11-22: len=0 ولی github.token = 377 کاراکتر) —
          # صریح می‌دهیم تا _dispatch_iv_deploy بیدار شدن iv-deploy.yml را
          # request کند (push از داخل workflow روی on:push اثر ندارد).
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m src.main

      - name: commit state
        run: |        
          # حفظ state و scorecard تولیدشده در اجرای جاری
          cp state.json /tmp/generated-state.json
          cp scorecard.html /tmp/generated-scorecard.html

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            # دریافت آخرین وضعیت مخزن
            git fetch origin main

            # شروع از آخرین main و حذف وضعیت نیمه‌کاره قبلی
            git reset --hard origin/main

            # بازگرداندن state و scorecard تولیدشده توسط اجرای جاری
            cp /tmp/generated-state.json state.json
            cp /tmp/generated-scorecard.html scorecard.html

            git add state.json scorecard.html

            # اگر تغییری باقی نمانده، کار تمام است
            if git diff --cached --quiet; then
              echo "state تغییر جدیدی ندارد"
              exit 0
            fi

            git commit -m "state: $(date -u '+%Y-%m-%d %H:%M UTC')"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "push شکست خورد (تلاش $attempt)"
            sleep 5
          done

          exit 1

      # deploy همان scorecard تازه‌ی تولیدشده در این اجرا به GitHub Pages.
      # مستقیم داخل همین workflow است (نه workflow جدا): هر اجرا scorecard
      # دارد، پس deploy هم دقیقا‌ همان لحظه و بدون وابستگی به trigger push.
      - name: stage site
        run: |
          mkdir site
          cp scorecard.html site/index.html
          # صفحات ترجمه‌ی کامل (worker در iv/ منتشر می‌کند) نباید در
          # deploy ساعتی از سایت ریزند — iv-deploy.yml همان ساختار را دارد.
          mkdir -p site/iv
          cp iv/*.html site/iv/ 2>/dev/null || true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4

