name: publish

# تایمینگ اجرای ساعتی روی cron-job.org است، نه cron خودِ GitHub.
# GitHub برای schedule تضمین اجرای سر ساعت نمی‌دهد و روی runnerهای شلوغ
# تأخیر پنج تا بیست دقیقه (و گاهی بیشتر) رایج است. cron-job.org هر ساعت
# با API گیت‌هاب (workflow_dispatch) این workflow را بیدار می‌کند:
#   method:  POST
#   url:     https://api.github.com/repos/<owner>/PersianTwitter/dispatches
#   body:    {"event": "workflow_dispatch"}
#   cron:    "23 5-21 * * *"   (UTC — ساعات بیداری تهران: ۹ صبح تا ۱ بامداد)
#   token:   یک GITHUB_TOKEN با scope repo
# راهنمای کامل نصب در بخش Deploying بخش README است.
on:
  workflow_dispatch:

# برای commit کردن state.json لازم است.
permissions:
  contents: write
  pages: write
  id-token: write

# اجراهای همزمان روی یک state.json به هم می‌ریزند.
concurrency:
  group: state-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m src.main

      - name: commit state
        run: |        
          # حفظ state و scorecard تولیدشده در اجرای جاری
          cp state.json /tmp/generated-state.json
          cp scorecard.html /tmp/generated-scorecard.html

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            # دریافت آخرین وضعیت مخزن
            git fetch origin main

            # شروع از آخرین main و حذف وضعیت نیمه‌کاره قبلی
            git reset --hard origin/main

            # بازگرداندن state و scorecard تولیدشده توسط اجرای جاری
            cp /tmp/generated-state.json state.json
            cp /tmp/generated-scorecard.html scorecard.html

            git add state.json scorecard.html

            # اگر تغییری باقی نمانده، کار تمام است
            if git diff --cached --quiet; then
              echo "state تغییر جدیدی ندارد"
              exit 0
            fi

            git commit -m "state: $(date -u '+%Y-%m-%d %H:%M UTC')"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "push شکست خورد (تلاش $attempt)"
            sleep 5
          done

          exit 1

      # deploy همان scorecard تازه‌ی تولیدشده در این اجرا به GitHub Pages.
      # مستقیم داخل همین workflow است (نه workflow جدا): هر اجرا scorecard
      # دارد، پس deploy هم دقیقاً همان لحظه و بدون وابستگی به trigger push.
      - name: stage site
        run: |
          mkdir site
          cp scorecard.html site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4

