name: publish

on:
  schedule:
    # ساعتی، ولی فقط در ساعات بیداری ایران. تهران UTC+3:30 است و DST ندارد،
    # پس 05:30 تا 21:30 UTC می‌شود ۹ صبح تا ۱ بامداد به وقت تهران: ۱۷ اجرا.
    # قبلاً ۲۴ ساعته بود و نصف پست‌ها بین ۲ تا ۸ صبح می‌رفتند که کسی نمی‌دید.
    - cron: "30 5-21 * * *"
  workflow_dispatch:

# برای commit کردن state.json لازم است.
permissions:
  contents: write

# اجراهای همزمان روی یک state.json به هم می‌ریزند.
concurrency:
  group: state-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m src.main

      - name: commit state
        run: |        
          # حفظ state تولیدشده در اجرای جاری
          cp state.json /tmp/generated-state.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            # دریافت آخرین وضعیت مخزن
            git fetch origin main

            # شروع از آخرین main و حذف وضعیت نیمه‌کاره قبلی
            git reset --hard origin/main

            # بازگرداندن state تولیدشده توسط اجرای جاری
            cp /tmp/generated-state.json state.json

            git add state.json

            # اگر تغییری باقی نمانده، کار تمام است
            if git diff --cached --quiet; then
              echo "state تغییر جدیدی ندارد"
              exit 0
            fi

            git commit -m "state: $(date -u '+%Y-%m-%d %H:%M UTC')"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "push شکست خورد (تلاش $attempt)"
            sleep 5
          done

          exit 1

